[package]
name = "kharness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tamper-resistant compile -> verify -> profile harness for candidate CUDA kernels"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "kharness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
