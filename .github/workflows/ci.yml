# CPU-only CI. No nvcc here: CUDA kernels and GPU tests run locally (`make test-gpu`).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not gpu"

  cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format
        run: find kernels runner tests/cpp \( -name '*.cu' -o -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
      - name: Build (runner only; kernels need nvcc)
        run: cmake -S . -B build && cmake --build build -j
